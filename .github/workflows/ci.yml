name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Dipin ke 16 dan dipasangkan dengan postgresql-client-16 di bawah.
        # Dengan `image: postgres` (latest, 18.x) sementara runner membawa client
        # 16.x, pg_dump MENOLAK jalan ("server version mismatch") — dan
        # EvidenceBackupServiceTest, yang memang menjalankan pg_dump sungguhan,
        # gagal untuk ketiga tabel. Kedua sisi harus dipin bersama; menaikkan
        # salah satunya saja akan mengulang kegagalan yang sama.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips postgresql-client-16

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Create Supabase-only roles
        # db/structure.sql memuat GRANT dan CREATE POLICY untuk role `anon`,
        # role bawaan Supabase yang memberi akses read-only ke dashboard statis.
        # Postgres polos di CI tak punya role itu, jadi structure_load gagal di
        # baris pertama policy dan SELURUH job test merah — begitulah CI merah
        # sejak 2026-08-29 tanpa ada yang benar-benar rusak di aplikasinya.
        # Membuat rolenya lebih jujur daripada menyaring privilege keluar dari
        # dump: yang diuji jadi bentuk skema yang sama dengan produksi.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF; END \$\$;"

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

# Job `system-test` DIHAPUS 2026-09-16. Ia menjalankan `bin/rails test:system`
# sementara direktori `test/system` tidak pernah ada di repo ini, jadi setiap run
# mati dengan `cannot load such file -- test/system`. Job yang selalu merah bukan
# jaring pengaman — ia melatih orang mengabaikan warna CI, dan itulah yang terjadi
# di sini: CI merah sejak 2026-08-29 tanpa ada yang menengok. Kalau nanti benar-benar
# ada system test, kembalikan job ini bersama test-nya, jangan sebelum itu.
